# --- SETTINGS ---
set -g default-terminal "screen-256color"

set -g renumber-windows on
set -gw xterm-keys on
set -sg escape-time 0
set -g history-limit 5000
set -g focus-events on
set -g display-time 4000
set -g mouse on
# allow hex colors to render as truecolor
set -as terminal-features ",*:RGB"


# --- STATUS BAR ---
# colours come from the active theme, theme/current.tmux (#{@theme_<name>})
# -q: if no theme is active, the first zsh to start falls back to one and loads it
source-file -q ~/.config/theme/current.tmux
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#{@theme_bg},fg=#{@theme_fg}"
set -g status-left-length 40
set -g status-right-length 80

# session segment turns the warn colour while the prefix is held
set -g status-left "#{?client_prefix,#[bg=#{@theme_warn}],#[bg=#{@theme_accent}]}#[fg=#{@theme_on_accent},bold]  #S #[bg=#{@theme_bg},nobold]#{?client_prefix,#[fg=#{@theme_warn}],#[fg=#{@theme_accent}]}"
# git branch and worktree segment is hidden outside a repo; the folder segment uses the accent
set -g status-right '#(~/.config/tmux/scripts/git-branch.sh "#{pane_current_path}")#[fg=#{@theme_on_accent},bg=#{@theme_accent},bold]  #{b:pane_current_path} '

# Claude Code state per window (@claude_status, set by scripts/claude-status.sh hooks)
# tabs are connected: each ends in an arrow into the next tab's colour, with a thin
# divider between two inactive tabs; the first tab opens with a notch
set -g window-status-separator ""
set -g window-status-current-style "bold"
set -g window-status-format "#{?window_start_flag,#[fg=#{@theme_bg}]#[bg=#{@theme_surface}],}#[fg=#{@theme_muted},bg=#{@theme_surface}] #I #W#{?#{==:#{@claude_status},thinking},#[fg=#{@theme_fg}] 󰔟,#{?#{==:#{@claude_status},waiting},#[fg=#{@theme_warn}] ,#{?#{==:#{@claude_status},done},#[fg=#{@theme_accent}] ,}}} #{?window_end_flag,#[fg=#{@theme_surface}]#[bg=#{@theme_bg}],#{?#{==:#{e|+:#{window_index},1},#{active_window_index}},#[fg=#{@theme_surface}]#[bg=#{@theme_accent}],#[fg=#{@theme_subtle}]#[bg=#{@theme_surface}]}}"
set -g window-status-current-format "#{?window_start_flag,#[fg=#{@theme_bg}]#[bg=#{@theme_accent}],}#[fg=#{@theme_on_accent},bg=#{@theme_accent},bold] #I #W#{?#{==:#{@claude_status},thinking}, 󰔟,#{?#{==:#{@claude_status},waiting}, ,#{?#{==:#{@claude_status},done}, ,}}}#{?window_zoomed_flag, 󰊓,} #[nobold]#{?window_end_flag,#[fg=#{@theme_accent}]#[bg=#{@theme_bg}],#[fg=#{@theme_accent}]#[bg=#{@theme_surface}]}"

set -g pane-border-style "fg=#{@theme_surface}"
set -g pane-active-border-style "fg=#{@theme_accent}"
set -g message-style "bg=#{@theme_surface},fg=#{@theme_fg}"
set -g message-command-style "bg=#{@theme_surface},fg=#{@theme_fg}"
set -g mode-style "bg=#{@theme_accent},fg=#{@theme_on_accent}"

# right-click menus
set -g menu-style "bg=#{@theme_bg},fg=#{@theme_fg}"
set -g menu-selected-style "bg=#{@theme_accent},fg=#{@theme_on_accent},bold"
set -g menu-border-style "fg=#{@theme_accent}"


# --- REMAPS ---
# remap prefix from 'C-b' to 'C-Space'
# if you have multiple keyboard inputs on a mac machine, make sure to disbable conflicting keymaps
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

unbind r
bind r source "~/.config/tmux/tmux.conf"
bind S setw synchronize-panes

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'jimeh/tmuxifier'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'

# Run <prefix + I> to install plugins
run '~/.config/tmux/plugins/tpm/tpm'
