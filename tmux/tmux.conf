# --- SETTINGS ---
set -g default-terminal "screen-256color"

set -g renumber-windows on
set -gw xterm-keys on
set -sg escape-time 0
set -g history-limit 5000
set -g focus-events on
set -g display-time 4000
set -g mouse on
# allow hex colors to render as truecolor
set -as terminal-features ",*:RGB"


# --- STATUS BAR ---
# palette: tmux's standard green accents on a dark bar; bg #16161e, surface #292e42,
# fg #c0caf5, muted #a9b1d6, prefix yellow
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#16161e,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 80

# session segment turns orange while the prefix is held
set -g status-left "#{?client_prefix,#[bg=yellow],#[bg=green]}#[fg=#16161e,bold]  #S #[bg=#16161e,nobold]#{?client_prefix,#[fg=yellow],#[fg=green]}"
# git branch segment is hidden outside a repo
set -g status-right '#(~/.config/tmux/scripts/git-branch.sh "#{pane_current_path}")#[fg=#c0caf5,bg=#292e42]  #{b:pane_current_path} '

# Claude Code state per window (@claude_status, set by scripts/claude-status.sh hooks)
set -g window-status-separator ""
set -g window-status-current-style "bold"
set -g window-status-format "#[fg=#16161e,bg=#292e42]#[fg=#a9b1d6,bg=#292e42] #I #W#{?#{==:#{@claude_status},thinking},#[fg=#c0caf5] 󰔟,#{?#{==:#{@claude_status},waiting},#[fg=yellow] ,#{?#{==:#{@claude_status},done},#[fg=green] ,}}} #[fg=#292e42,bg=#16161e]"
set -g window-status-current-format "#[fg=#16161e,bg=green]#[fg=#16161e,bg=green,bold] #I #W#{?#{==:#{@claude_status},thinking}, 󰔟,#{?#{==:#{@claude_status},waiting}, ,#{?#{==:#{@claude_status},done}, ,}}}#{?window_zoomed_flag, 󰊓,} #[fg=green,bg=#16161e,nobold]"

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=green"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=green,fg=#16161e"

# right-click menus
set -g menu-style "bg=#16161e,fg=#c0caf5"
set -g menu-selected-style "bg=green,fg=#16161e,bold"
set -g menu-border-style "fg=green"


# --- REMAPS ---
# remap prefix from 'C-b' to 'C-Space'
# if you have multiple keyboard inputs on a mac machine, make sure to disbable conflicting keymaps
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

unbind r
bind r source "~/.config/tmux/tmux.conf"
bind S setw synchronize-panes

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'jimeh/tmuxifier'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'

# Run <prefix + I> to install plugins
run '~/.config/tmux/plugins/tpm/tpm'
