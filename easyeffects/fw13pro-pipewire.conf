# fw13pro speaker processing, converted from the EasyEffects "fw13pro" preset.
# Source preset: easyeffects/fw13pro.json. Needs lsp-plugins-lv2. Install steps: easyeffects/README.md.
# Chain: EQ -> loudness (LSP, ISO226-2023, +7) -> compressor -> limiter. (EQ: 10 bands, LSP compressor + limiter)
# Gain staging: EQ in -19 dB + EQ out +11 dB = -8 dB applied at loudness input; compressor in +15 dB.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Speakers (fw13pro)"
      media.name       = "Speakers (fw13pro)"
      filter.graph = {
        nodes = [
          { type = builtin name = eq label = param_eq
            config = {
              filters = [
                { type = bq_peaking freq = 29.95   gain = -11.83 q = 1.5048 }
                { type = bq_peaking freq = 59.76   gain = -4.59  q = 1.5048 }
                { type = bq_peaking freq = 119.24  gain = -3.49  q = 1.5048 }
                { type = bq_peaking freq = 237.92  gain = -5.71  q = 1.5048 }
                { type = bq_peaking freq = 474.72  gain = -13.66 q = 1.5048 }
                { type = bq_peaking freq = 947.19  gain = -10.36 q = 1.5048 }
                { type = bq_peaking freq = 1889.88 gain = -12.59 q = 1.5048 }
                { type = bq_peaking freq = 3770.81 gain = -5.89  q = 1.5048 }
                { type = bq_peaking freq = 7523.76 gain = -3.92  q = 1.5048 }
                { type = bq_peaking freq = 15011.87 gain = -4.95 q = 1.5048 }
              ]
            }
          }
          { type = lv2 name = loud plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_stereo"
            control = {
              "input"  = 0.3981  # -8 dB (net EQ input/output gain)
              "mode"   = 0       # FFT
              "std"    = 4       # ISO226-2023
              "fft"    = 0       # 256
              "volume" = 7.0
              "hclip"  = 0
            }
          }
          { type = lv2 name = comp plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
            control = {
              "g_in" = 5.6234   # +15 dB
              "cm"   = 0        # downward
              "sct"  = 0        # feed-forward
              "scm"  = 0        # peak
              "scs"  = 0        # middle
              "al"   = 0.5012   # threshold -6 dB
              "kn"   = 0.5012   # knee -6 dB
              "cr"   = 4.0
              "at"   = 5.0
              "rt"   = 100.0
              "bth"  = 0.000251 # boost threshold -72 dB
              "bsa"  = 1.9953   # boost amount +6 dB
              "mk"   = 1.0
              "cdr"  = 0.0
              "cwt"  = 1.0
            }
          }
          { type = lv2 name = lim plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              "mode"  = 9       # Line Wide
              "th"    = 1.0     # 0 dB
              "alr"   = 0
              "boost" = 1
              "lk"    = 5.0
              "at"    = 5.0
              "rt"    = 5.0
              "slink" = 100.0
            }
          }
        ]
        links = [
          { output = "eq:Out 1"   input = "loud:in_l" }
          { output = "eq:Out 2"   input = "loud:in_r" }
          { output = "loud:out_l" input = "comp:in_l" }
          { output = "loud:out_r" input = "comp:in_r" }
          { output = "comp:out_l" input = "lim:in_l" }
          { output = "comp:out_r" input = "lim:in_r" }
        ]
        inputs  = [ "eq:In 1" "eq:In 2" ]
        outputs = [ "lim:out_l" "lim:out_r" ]
      }
      capture.props = {
        node.name      = "effect_input.fw13pro"
        media.class    = Audio/Sink
        audio.position = [ FL FR ]
        priority.session = 2000
      }
      playback.props = {
        node.name      = "effect_output.fw13pro"
        node.passive   = true
        audio.position = [ FL FR ]
        target.object  = "alsa_output.pci-0000_00_1f.3.analog-stereo"
      }
    }
  }
]
