[tools]
# Distro packages lag behind; the nvim config needs 0.12+
neovim = "latest"
go = "latest"
node = "26"
rust = "latest"
# CLI that nvim-treesitter builds parsers with
tree-sitter = "latest"

# CLI tools: prebuilt binaries, same versions on every OS
bat = "latest"
fd = "latest"
fzf = "latest"
helix = "latest"
k9s = "latest"
kubectl = "latest"
kubectx = "latest"
kubens = "latest"
lazygit = "latest"
ripgrep = "latest"
zig = "latest"
