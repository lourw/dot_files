# Symlinks from the repo into place: { src, dest }.
# Used by tasks/setup.yaml to install and uninstall.yaml to remove them.
dotfile_links:
  - { src: "{{ dot_files_path }}/nvim", dest: "{{ config_path }}/nvim" }
  - { src: "{{ dot_files_path }}/helix", dest: "{{ config_path }}/helix" }
  - { src: "{{ dot_files_path }}/tmux", dest: "{{ config_path }}/tmux" }
  - { src: "{{ dot_files_path }}/zsh/zshconf", dest: "{{ home_path }}/.zshconf" }
  - { src: "{{ dot_files_path }}/zsh/utils.sh", dest: "{{ config_path }}/utils.sh" }
  - { src: "{{ dot_files_path }}/fd", dest: "{{ config_path }}/fd" }
  - { src: "{{ dot_files_path }}/mise", dest: "{{ config_path }}/mise" }
  - { src: "{{ dot_files_path }}/wezterm", dest: "{{ config_path }}/wezterm" }
  - { src: "{{ dot_files_path }}/zed", dest: "{{ config_path }}/zed" }

# Links created by older versions of this repo, removed if they point into it
dotfile_legacy_links:
  - "{{ home_path }}/.fdignore"
