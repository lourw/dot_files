# Setup symlinks such that all config files in repo get placed
# where they are supposed to be. The list lives in vars/links.yaml.
- name: Setup config symlinks
  include_tasks: "{{ playbook_path }}/tasks/link.yaml"
  vars:
    links: "{{ dotfile_links }}"

- name: Check legacy symlinks
  stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ dotfile_legacy_links }}"
  register: legacy_links

- name: Remove legacy symlinks into the repo
  file:
    path: "{{ legacy.item }}"
    state: absent
  loop: "{{ legacy_links.results }}"
  loop_control:
    loop_var: legacy
    label: "{{ legacy.item }}"
  when: legacy.stat.islnk | default(false) and legacy.stat.lnk_source is match(dot_files_path)
