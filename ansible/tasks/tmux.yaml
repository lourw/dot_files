- name: Ensure that tpm directory exists
  file:
    path: "{{ dot_files_path }}/tmux/plugins"
    state: directory
    recurse: yes

- name: Clone tpm into plugins folder
  git: 
    repo: 'https://github.com/tmux-plugins/tpm'
    dest: "{{ dot_files_path }}/tmux/plugins/tpm"
    update: yes

- name: Install tmux plugins
  command: "{{ dot_files_path }}/tmux/plugins/tpm/bin/install_plugins"
  register: tpm_install
  changed_when: "'download success' in tpm_install.stdout"
