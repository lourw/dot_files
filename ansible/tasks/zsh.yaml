# The lines live in vars/zshrc.yaml so uninstall.yaml can remove them
- name: Add dotfile config to .zshrc
  lineinfile:
    path: "{{ home_path }}/.zshrc"
    line: "{{ item }}"
    state: present
    create: yes
  loop: "{{ zshrc_lines }}"

- name: Remove legacy lines from .zshrc
  lineinfile:
    path: "{{ home_path }}/.zshrc"
    line: "{{ item }}"
    state: absent
  loop: "{{ zshrc_legacy_lines }}"
