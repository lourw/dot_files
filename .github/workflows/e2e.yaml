name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Fresh Arch container rather than the runner host, whose preinstalled
    # tools and directories don't look like a new machine
    container: archlinux:latest
    steps:
      # Without git, checkout downloads a tarball with no .git, which bootstrap.sh rejects
      - name: Install git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
      # Runs as root: creates a sudo user and runs tests/e2e.sh as them
      - name: Run e2e test
        run: bash tests/container.sh
