# DeepSeek Harness profile patch, linked to $DSH_HOME/profiles/web/cordis.patch.yml.
# Keep the llama-server URL and model in sync with ai/opencode and ai/pi.
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: llama-server
    model: qwen3.8-flash-next
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      llama-server:
        # llama-server ignores the key, dsh just needs one set (exported in zshconf)
        apiKeyEnv: LLAMA_SERVER_API_KEY
        api: openai-completions
        baseURL: https://cachy.tail1107be.ts.net/v1
        models:
          - id: qwen3.8-flash-next
            name: Qwen3.8 Flash-Next (local)
            contextWindow: 131072
            maxTokens: 16384
