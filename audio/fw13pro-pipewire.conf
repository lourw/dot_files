# fw13pro speaker processing, converted from the EasyEffects "fw13pro" preset.
# Source preset: audio/fw13pro.json (EQ retuned by ear; mids-highs good, low end in progress — see README). Needs lsp-plugins-lv2 and calf. Install steps: audio/README.md.
# Chain: EQ (10 bands) -> bass enhancer (Calf) -> loudness (LSP, ISO226-2023, +7) -> compressor (LSP) -> bass-band compressor (<200 Hz) -> limiter (LSP).
# Gain staging: EQ in -19 dB + EQ out +11 dB = -8 dB applied at loudness input; compressor in +15 dB.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Speakers (fw13pro)"
      media.name       = "Speakers (fw13pro)"
      filter.graph = {
        nodes = [
          { type = builtin name = eq label = param_eq
            config = {
              filters = [
                { type = bq_highpass  freq = 90    q = 0.541 }          # 4th-order Butterworth high-pass at 90 Hz:
                { type = bq_highpass  freq = 90    q = 1.307 }          # measured: speakers overdrive below ~90 Hz
                { type = bq_peaking freq = 29.95   gain = -11.83 q = 1.5048 }
                { type = bq_peaking freq = 59.76   gain = -3.0   q = 1.5048 }
                { type = bq_peaking freq = 119.24  gain = 3.0    q = 1.5048 }
                { type = bq_peaking freq = 237.92  gain = 0.0    q = 1.5048 }
                { type = bq_peaking freq = 474.72  gain = -9.0   q = 1.5048 }
                { type = bq_peaking freq = 947.19  gain = -6.0   q = 1.5048 }
                { type = bq_peaking freq = 1889.88 gain = -6.0   q = 1.5048 }
                { type = bq_peaking freq = 3770.81 gain = -6.0   q = 1.5048 }
                { type = bq_peaking freq = 7523.76 gain = -6.0   q = 1.5048 }
                { type = bq_peaking freq = 15011.87 gain = -1.0  q = 1.5048 }
                { type = bq_highshelf freq = 10000 gain = 3.5 q = 0.707 }  # air/clarity above the sibilance range
              ]
            }
          }
          { type = lv2 name = bass plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
            control = {
              "amount"       = 1.585  # +4 dB
              "drive"        = 7.0    # harmonics (lower = less saturation on hard hits)
              "blend"        = 0.0
              "freq"         = 200.0  # scope: synthesize harmonics of content below 200 Hz
              "floor_active" = 1
              "floor"        = 10.0
            }
          }
          { type = lv2 name = loud plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_stereo"
            control = {
              "input"  = 0.3981  # -8 dB (net EQ input/output gain)
              "mode"   = 0       # FFT
              "std"    = 4       # ISO226-2023
              "fft"    = 0       # 256
              "volume" = 7.0
              "hclip"  = 0
            }
          }
          { type = lv2 name = comp plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
            control = {
              "g_in" = 5.6234   # +15 dB
              "cm"   = 0        # downward
              "sct"  = 0        # feed-forward
              "scm"  = 1        # RMS (smoother, less pumping)
              "scs"  = 0        # middle
              "shpm" = 2        # sidechain high-pass 24 dB/oct ...
              "shpf" = 200.0    # ... at 200 Hz, so bass hits don't duck the whole mix
              "al"   = 0.5012   # threshold -6 dB
              "kn"   = 0.5012   # knee -6 dB
              "cr"   = 4.0
              "at"   = 5.0
              "rt"   = 100.0
              "bth"  = 0.000251 # boost threshold -72 dB
              "bsa"  = 1.9953   # boost amount +6 dB
              "mk"   = 1.0
              "cdr"  = 0.0
              "cwt"  = 1.0
            }
          }
          # --- bass protection: split at 200 Hz (LR4), compress only the lows, sum back ---
          { type = builtin name = xlo label = param_eq
            config = { filters = [ { type = bq_lowpass  freq = 200 q = 0.707 } { type = bq_lowpass  freq = 200 q = 0.707 } ] } }
          { type = builtin name = xhi label = param_eq
            config = { filters = [ { type = bq_highpass freq = 200 q = 0.707 } { type = bq_highpass freq = 200 q = 0.707 } ] } }
          { type = lv2 name = bcomp plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
            control = {
              "cm"  = 0         # downward
              "scm" = 0         # peak
              "al"  = 0.5012    # threshold -6 dB (measured: speakers clean at full scale 100-200 Hz)
              "kn"  = 0.5012    # knee -6 dB
              "cr"  = 4.0
              "at"  = 15.0      # slower attack lets the kick transient (punch) through
              "rt"  = 150.0
              "mk"  = 1.0
              "cdr" = 0.0
              "cwt" = 1.0
            }
          }
          { type = builtin name = xsub label = param_eq   # speaker protection after all gain stages
            config = { filters = [ { type = bq_highpass freq = 95 q = 0.541 } { type = bq_highpass freq = 95 q = 1.307 } ] } }  # 4th-order Butterworth: sharp knee, keeps 100-125 Hz
          { type = builtin name = mixl label = mixer }
          { type = builtin name = mixr label = mixer }
          { type = lv2 name = lim plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              "mode"  = 9       # Line Wide
              "th"    = 1.0     # 0 dB
              "alr"   = 0
              "boost" = 1
              "lk"    = 5.0
              "at"    = 5.0
              "rt"    = 20.0    # slower release = less low-frequency distortion
              "slink" = 100.0
            }
          }
        ]
        links = [
          { output = "eq:Out 1"   input = "bass:in_l" }
          { output = "eq:Out 2"   input = "bass:in_r" }
          { output = "bass:out_l" input = "loud:in_l" }
          { output = "bass:out_r" input = "loud:in_r" }
          { output = "loud:out_l" input = "comp:in_l" }
          { output = "loud:out_r" input = "comp:in_r" }
          { output = "comp:out_l" input = "xlo:In 1" }
          { output = "comp:out_r" input = "xlo:In 2" }
          { output = "comp:out_l" input = "xhi:In 1" }
          { output = "comp:out_r" input = "xhi:In 2" }
          { output = "xlo:Out 1"  input = "bcomp:in_l" }
          { output = "xlo:Out 2"  input = "bcomp:in_r" }
          { output = "bcomp:out_l" input = "xsub:In 1" }
          { output = "bcomp:out_r" input = "xsub:In 2" }
          { output = "xsub:Out 1"  input = "mixl:In 1" }
          { output = "xhi:Out 1"   input = "mixl:In 2" }
          { output = "xsub:Out 2"  input = "mixr:In 1" }
          { output = "xhi:Out 2"   input = "mixr:In 2" }
          { output = "mixl:Out"   input = "lim:in_l" }
          { output = "mixr:Out"   input = "lim:in_r" }
        ]
        inputs  = [ "eq:In 1" "eq:In 2" ]
        outputs = [ "lim:out_l" "lim:out_r" ]
      }
      capture.props = {
        node.name      = "effect_input.fw13pro"
        media.class    = Audio/Sink
        audio.position = [ FL FR ]
        priority.session = 2000
      }
      playback.props = {
        node.name      = "effect_output.fw13pro"
        node.passive   = true
        audio.position = [ FL FR ]
        target.object  = "alsa_output.pci-0000_00_1f.3.analog-stereo"
      }
    }
  }
]
